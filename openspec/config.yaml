strict_tdd: true
context: |
  sistema-garfex uses Vitest 4.1.11 through pnpm.
  Unit/domain tests run with Vitest; Convex integration-style tests use convex-test under the same runner.
  No E2E test layer or command is configured.
  Typecheck uses the package script pnpm typecheck, which runs tsc --noEmit.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "pnpm exec vitest run"
  verify:
    test_command: "pnpm exec vitest run && pnpm typecheck"
testing:
  detected: "2026-08-28"
  runner:
    command: "pnpm exec vitest run"
    framework: "Vitest 4"
  layers:
    unit: "Vitest"
    integration: "convex-test via Vitest"
    e2e: ""
  commands:
    unit:
      - "pnpm exec vitest run"
    integration:
      - "pnpm exec vitest run"
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: "pnpm typecheck (tsc --noEmit)"
  typecheck_commands:
    - "pnpm typecheck"
  format: ""
  format_commands:
    []
